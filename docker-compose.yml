services:
  postgres:
    image: postgres:17
    container_name: askmydocs_postgres
    environment:
      POSTGRES_USER: askmydocs
      POSTGRES_PASSWORD: askmydocs123
      POSTGRES_DB: askmydocs
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmydocs"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: askmydocs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: